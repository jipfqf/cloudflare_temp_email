name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}

          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}

          cd worker/
          # 使用环境变量写入 wrangler.toml
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          echo "=== generated wrangler.toml ==="
          cat wrangler.toml

          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          # ⚠️ 不再吞掉部署日志, 出错时可以看到 wrangler 真实报错
          pnpm run deploy
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}

      - name: Verify D1 binding after deploy
        run: |
          echo "Checking mail-worker latest version bindings..."
          python3 -c "
import urllib.request, json, os
acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; tok=os.environ['CLOUDFLARE_API_TOKEN']
req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/%s/workers/scripts/mail-worker/versions?per_page=1'%acct, headers={'Authorization':'Bearer '+tok})
d=json.loads(urllib.request.urlopen(req, timeout=30).read())
items=d.get('result',{}).get('items',[])
if not items:
    print('FAIL: no versions'); exit(1)
bs=items[0].get('resources',{}).get('bindings',[])
names=[b['name'] for b in bs]
print('latest version bindings (%d): %s'%(len(names), names))
if not any(b.get('type')=='d1' for b in bs):
    print('FAIL: D1 binding missing'); exit(1)
print('OK: D1 binding present')
"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}