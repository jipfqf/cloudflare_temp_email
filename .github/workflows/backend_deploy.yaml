name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}

          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}

          cd worker/
          # 使用环境变量写入 wrangler.toml
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          echo "=== generated wrangler.toml ==="
          cat wrangler.toml

          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          # ⚠️ 不再吞掉部署日志, 出错时可以看到 wrangler 真实报错
          pnpm run deploy 2>&1 | tee /tmp/deploy.log
          echo "Deployed for tag ${{ github.ref_name }}"
          # 部署后校验: wrangler 输出必须包含 D1 绑定
          if ! grep -q "env.DB" /tmp/deploy.log; then
            echo "FAIL: D1 binding missing in deploy output!"
            exit 1
          fi
          echo "OK: D1 binding present, deployment verified"
          # ⚠️ 核心防线 (2026-10-08 404 事故): wrangler 部署后 3~5 秒可能冒出"0绑定无脚本"的
          # 纯 assets 版本抢占 100% 流量, 导致 /open_api /admin /user_api 全 404。
          # 下面的自愈器会盯 120 秒: 一旦被抢就立刻 pin 回刚部署的正确版本,
          # 结束时激活版本正确 -> 部署直接成功; pin 不回去才让 job 失败报警。
          DEPLOYED_VERSION_ID=$(grep -oE 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log | head -1 | awk '{print $4}')
          if [ -z "$DEPLOYED_VERSION_ID" ]; then
            echo "FAIL: cannot parse Current Version ID from deploy log"
            exit 1
          fi
          echo "deployed version: $DEPLOYED_VERSION_ID"
          python3 ../.github/scripts/heal_worker.py --watch 120 --expect "$DEPLOYED_VERSION_ID"
          # 自动触发数据库增量迁移，防止版本更新后缺少新表或新列
          python3 -c "import urllib.request, re, time; m = re.search(r'ADMIN_PASSWORDS\s*=\s*\[\s*\"([^\"]+)\"', open('wrangler.toml').read()); (time.sleep(3), urllib.request.urlopen(urllib.request.Request('https://mail-worker.jipfqf.workers.dev/admin/db_migration', headers={'x-admin-auth': m.group(1), 'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions'}, method='POST'))) if m else None" || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}